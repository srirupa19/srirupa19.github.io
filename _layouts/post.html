---
layout: default
---
<div class="container">
  <div class="row">
    <div class="col-lg-9 offset-lg-1">
      <article class="h-entry" itemscope itemtype="http://schema.org/BlogPosting">
        <header class="post-header">
          <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
          <p class="post-meta">
            <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>
            &middot; <a href="{{ '/blog/' | relative_url }}">All posts</a>
          </p>
        </header>

        <div class="post-content e-content" itemprop="articleBody">
          {{ content }}
        </div>

        {%- if site.disqus.shortname -%}
          {%- include disqus_comments.html -%}
        {%- endif -%}
      </article>
    </div>
  </div>
</div>
